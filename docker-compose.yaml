      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: analytics-service
      JAVA_TOOL_OPTIONS: "-Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
