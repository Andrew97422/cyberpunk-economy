# Single-host orchestration: ONE Postgres (DB-per-service via separate databases)
# + Kafka + gateway + 8 Kafka microservices + the unified frontend SPA (nginx).
# Resource-optimised: 1 Postgres instead of 8, capped JVM heaps, kafka-ui off by default.
# The SPA talks to the gateway same-origin via /api (nginx reverse-proxy -> core:8080).

services:
  postgres:
    image: postgres:16
    container_name: game-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=60", "-c", "work_mem=4MB"]
    environment:
      POSTGRES_DB: ${DB_NAME:-game_core}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set this in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the per-service databases on first init.
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-game_core}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  kafka:
    image: apache/kafka:3.8.0
    container_name: game-core-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_HEAP_OPTS=-Xmx384m -Xms256m
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_LISTENERS=EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      # Single-broker cluster: internal topics must use RF=1, otherwise
      # __consumer_offsets never gets created and ALL consumer groups stall.
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      game_network:
        aliases:
          - kafka

  core:
    build:
      context: ./main-server
      dockerfile: Dockerfile
    container_name: game-core-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-game_core}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      # JWT signing secret must be valid Base64 (the gateway Base64-decodes it).
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set this in .env}
      JAVA_TOOL_OPTIONS: "-Xmx192m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "4"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "20"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "2"
      SPRING_JMX_ENABLED: "false"
      APP_MEDIA_DIR: /app/media
    ports:
      - "8080:8080"
    volumes:
      - media_data:/app/media
    networks:
      - game_network

  banking-service:
    build:
      context: ./main-server/banking-service
