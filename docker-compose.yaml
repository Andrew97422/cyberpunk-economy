      - "8091:8091"
    networks:
      - game_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game-frontend
    restart: unless-stopped
    depends_on:
      - core
    ports:
      # Порт 80 → чистый адрес без порта: http://bank.lan
      - "80:80"
    networks:
      - game_network

  # Локальный DNS: раздаёт красивые имена bank.lan / game.lan -> IP ноута A.
  # Чтобы заработало для всех устройств, в DHCP роутера укажи этот ноут (LAN_IP)
  # как DNS-сервер. См. ИНСТРУКЦИЯ/09-КРАСИВЫЙ-АДРЕС-DNS.md.
  dns:
    image: 4km3/dnsmasq:latest
    container_name: game-dns
    restart: unless-stopped
    command:
      - --address=/bank.lan/${LAN_IP:-192.168.1.10}
      - --address=/game.lan/${LAN_IP:-192.168.1.10}
      - --no-resolv
      - --log-facility=-
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    networks:
      - game_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: game-core-kafka-ui
    profiles: ["tools"]   # not started by default; `docker compose --profile tools up -d kafka-ui`
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=game-core
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
    networks:
      - game_network

volumes:
  postgres_data:
  kafka_data:
    driver: local
  media_data:

networks:
  game_network:
    driver: bridge
