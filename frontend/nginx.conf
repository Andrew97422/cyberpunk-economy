server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow image uploads through the /api proxy (default nginx limit is 1MB -> 413).
    client_max_body_size 12m;

    # Efficient static file delivery.
    sendfile on;
    tcp_nopush on;

    # Compress text-based assets on the fly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Long-cache fingerprinted static assets. Listed before the SPA fallback
    # and only matches asset file extensions, so it never shadows /api/ or the
    # history fallback (which serve extension-less / non-asset paths).
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse-proxy API calls to the backend gateway (same origin -> no CORS).
    # "core" is the gateway service name in docker-compose.
    location ^~ /api/ {
        proxy_pass http://core:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
