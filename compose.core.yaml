# ── Machine 1 (CORE / infra) ──────────────────────────────────────────────
# Runs Kafka + the gateway (core) + the frontend + the core DB.
# This is the ONLY machine that runs Kafka; the finance/rest machines connect
# to it over the LAN at ${CORE_HOST}:9092.
#
# REQUIRED: set CORE_HOST in .env to THIS machine's LAN IP (e.g. 192.168.1.10)
# so Kafka advertises a LAN-reachable address. Clients open the frontend on
# http://${CORE_HOST}:8088 (gateway proxied at /api).
#
#   docker compose -f compose.core.yaml up -d
#   docker compose -f compose.core.yaml --profile tools up -d kafka-ui   # optional

services:
  postgres:
    image: postgres:16
    container_name: game-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-game_core}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set this in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-game_core}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  kafka:
    image: apache/kafka:3.8.0
    container_name: game-core-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms256m
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_LISTENERS=EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      # EXTERNAL is what REMOTE machines use — it must be this host's LAN IP.
      # INTERNAL stays docker-internal for the co-located core service.
      - KAFKA_ADVERTISED_LISTENERS=EXTERNAL://${CORE_HOST:-localhost}:9092,INTERNAL://kafka:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      # Single broker → all internal topics RF=1 (otherwise consumer groups stall).
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      game_network:
        aliases:
          - kafka

  core:
    build:
      context: ./main-server
      dockerfile: Dockerfile
    container_name: game-core-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-game_core}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set this in .env}
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC"
    ports:
      - "8080:8080"
    networks:
      - game_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: game-frontend
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "8088:80"
    networks:
      - game_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: game-core-kafka-ui
    profiles: ["tools"]
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=game-core
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
    networks:
      - game_network

volumes:
  postgres_data:
  kafka_data:
    driver: local

networks:
  game_network:
    driver: bridge
