version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: game-core-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-game_core}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set this in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-game_core}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  banking-postgres:
    image: postgres:16
    container_name: banking-postgres
    environment:
      POSTGRES_DB: ${BANKING_DB_NAME:-banking_db}
      POSTGRES_USER: ${BANKING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${BANKING_DB_PASSWORD:?set this in .env}
    ports:
      - "5433:5432"
    volumes:
      - banking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${BANKING_DB_USER:-postgres} -d ${BANKING_DB_NAME:-banking_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  accounts-postgres:
    image: postgres:16
    container_name: accounts-postgres
    environment:
      POSTGRES_DB: ${ACCOUNTS_DB_NAME:-accounts_db}
      POSTGRES_USER: ${ACCOUNTS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set this in .env}
    ports:
      - "5434:5432"
    volumes:
      - accounts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USER:-postgres} -d ${ACCOUNTS_DB_NAME:-accounts_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  access-postgres:
    image: postgres:16
    container_name: access-postgres
    environment:
      POSTGRES_DB: ${ACCESS_DB_NAME:-access_db}
      POSTGRES_USER: ${ACCESS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ACCESS_DB_PASSWORD:?set this in .env}
    ports:
      - "5435:5432"
    volumes:
      - access_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ACCESS_DB_USER:-postgres} -d ${ACCESS_DB_NAME:-access_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  card-postgres:
    image: postgres:16
    container_name: card-postgres
    environment:
      POSTGRES_DB: ${CARD_DB_NAME:-card_db}
      POSTGRES_USER: ${CARD_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CARD_DB_PASSWORD:?set this in .env}
    ports:
      - "5437:5432"
    volumes:
      - card_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CARD_DB_USER:-postgres} -d ${CARD_DB_NAME:-card_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  terminal-postgres:
    image: postgres:16
    container_name: terminal-postgres
    environment:
      POSTGRES_DB: ${TERMINAL_DB_NAME:-terminal_db}
      POSTGRES_USER: ${TERMINAL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${TERMINAL_DB_PASSWORD:?set this in .env}
    ports:
      - "5438:5432"
    volumes:
      - terminal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TERMINAL_DB_USER:-postgres} -d ${TERMINAL_DB_NAME:-terminal_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  audit-postgres:
    image: postgres:16
    container_name: audit-postgres
    environment:
      POSTGRES_DB: ${AUDIT_DB_NAME:-audit_db}
      POSTGRES_USER: ${AUDIT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:?set this in .env}
    ports:
      - "5436:5432"
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER:-postgres} -d ${AUDIT_DB_NAME:-audit_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  kafka:
    image: apache/kafka:3.8.0
    container_name: game-core-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_LISTENERS=EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      game_network:
        aliases:
          - kafka

  core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-core-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-game_core}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
    ports:
      - "8080:8080"
    networks:
      - game_network

  banking-service:
    build:
      context: ./banking-service
      dockerfile: Dockerfile
    container_name: banking-service-app
    depends_on:
      banking-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      DB_HOST: banking-postgres
      DB_PORT: 5432
      DB_NAME: ${BANKING_DB_NAME:-banking_db}
      DB_USER: ${BANKING_DB_USER:-postgres}
      DB_PASSWORD: ${BANKING_DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: banking-group
    ports:
      - "8081:8081"
    networks:
      - game_network

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service-app
    depends_on:
      accounts-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      DB_HOST: accounts-postgres
      DB_PORT: 5432
      DB_NAME: ${ACCOUNTS_DB_NAME:-accounts_db}
      DB_USER: ${ACCOUNTS_DB_USER:-postgres}
      DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: account-service
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set this in .env}
    ports:
      - "8082:8082"
    networks:
      - game_network

  access-service:
    build:
      context: ./access-service
      dockerfile: Dockerfile
    container_name: access-service-app
    depends_on:
      access-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8083
      DB_HOST: access-postgres
      DB_PORT: 5432
      DB_NAME: ${ACCESS_DB_NAME:-access_db}
      DB_USER: ${ACCESS_DB_USER:-postgres}
      DB_PASSWORD: ${ACCESS_DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: access-service
    ports:
      - "8083:8083"
    networks:
      - game_network

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: audit-service-app
    depends_on:
      audit-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      DB_HOST: audit-postgres
      DB_PORT: 5432
      DB_NAME: ${AUDIT_DB_NAME:-audit_db}
      DB_USER: ${AUDIT_DB_USER:-postgres}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: audit-service
      AUDIT_HACK_TOKEN: ${AUDIT_HACK_TOKEN:-}
    ports:
      - "8084:8084"
    networks:
      - game_network

  card-service:
    build:
      context: ./card-service
      dockerfile: Dockerfile
    container_name: card-service-app
    depends_on:
      card-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8085
      DB_HOST: card-postgres
      DB_PORT: 5432
      DB_NAME: ${CARD_DB_NAME:-card_db}
      DB_USER: ${CARD_DB_USER:-postgres}
      DB_PASSWORD: ${CARD_DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: card-service
    ports:
      - "8085:8085"
    networks:
      - game_network

  terminal-service:
    build:
      context: ./terminal-service
      dockerfile: Dockerfile
    container_name: terminal-service-app
    depends_on:
      terminal-postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8086
      DB_HOST: terminal-postgres
      DB_PORT: 5432
      DB_NAME: ${TERMINAL_DB_NAME:-terminal_db}
      DB_USER: ${TERMINAL_DB_USER:-postgres}
      DB_PASSWORD: ${TERMINAL_DB_PASSWORD:?set this in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_GROUP_ID: terminal-service
    ports:
      - "8086:8086"
    networks:
      - game_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: game-core-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=game-core
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
    networks:
      - game_network

volumes:
  postgres_data:
  banking_postgres_data:
  accounts_postgres_data:
  access_postgres_data:
  audit_postgres_data:
  card_postgres_data:
  terminal_postgres_data:
  kafka_data:
    driver: local

networks:
  game_network:
    driver: bridge
