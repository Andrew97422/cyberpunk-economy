      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUDIT_DB_USER:-postgres} -d ${AUDIT_DB_NAME:-audit_db}" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - game_network

  audit-service:
    build:
      context: ./main-server/audit-service
      dockerfile: Dockerfile
    container_name: audit-service-app
    restart: unless-stopped
    depends_on:
      audit-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      DB_HOST: audit-postgres
      DB_PORT: 5432
      DB_NAME: ${AUDIT_DB_NAME:-audit_db}
      DB_USER: ${AUDIT_DB_USER:-postgres}
      DB_PASSWORD: ${AUDIT_DB_PASSWORD:-postgres}
      KAFKA_BOOTSTRAP_SERVERS: ${CORE_HOST}:9092
      KAFKA_GROUP_ID: audit-service
      JAVA_TOOL_OPTIONS: "-Xmx160m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
      AUDIT_HACK_TOKEN: ${AUDIT_HACK_TOKEN:-}
    ports:
      - "8084:8084"
    networks:
      - game_network

volumes:
  card_postgres_data:
  terminal_postgres_data:
  marketplace_postgres_data:
  news_postgres_data:
  audit_postgres_data:

networks:
  game_network:
    driver: bridge
